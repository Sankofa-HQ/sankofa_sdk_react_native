apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'expo-module'

android {
  namespace 'dev.sankofa.rn'
  compileSdk 35

  defaultConfig {
    minSdk 23
    targetSdk 35
  }

  buildFeatures {
    buildConfig false
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  // Expo Modules Core — provides Module, ModuleDefinition, appContext, etc.
  implementation project(':expo-modules-core')

  // Sankofa Android SDK — included as a local project dependency.
  // In the example app's settings.gradle, add:
  //   include ':sankofa'
  //   project(':sankofa').projectDir = new File('../../sdks/sankofa_sdk_android/sankofa')
  implementation project(':sankofa')
}
