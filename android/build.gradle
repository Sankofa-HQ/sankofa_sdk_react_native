plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

// ─────────────────────────────────────────────────────────────────────────────
// android/build.gradle
//
// Thin Expo Module bridge — all analytics logic lives in the sankofa-android
// Maven artifact (the native Android SDK).
//
// For monorepo / local development, the example app's settings.gradle uses
// a Gradle composite build to substitute the dependency:
//
//   includeBuild('../../../sdks/sankofa_sdk_android') {
//       dependencySubstitution {
//           substitute module('dev.sankofa.sdk:sankofa-android') using project(':sankofa')
//       }
//   }
//
// For production installs, the AAR resolves from Maven Central.
// ─────────────────────────────────────────────────────────────────────────────

group = 'dev.sankofa.rn'
version = '0.1.0'

android {
  namespace 'dev.sankofa.rn'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // 2.0.0 pulls in the parent SDK's hardening audit fixes + native Pulse
  // auto-show (parity with iOS). The bridge's narrow API usage (init,
  // SankofaConfig data class, screen/track/identify/reset/flush,
  // replaySessionId) is source-compatible across the 1.x→2.x major bump.
  implementation 'dev.sankofa.sdk:sankofa-android:2.0.0'
}
